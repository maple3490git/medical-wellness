# Medical Wellness — Development infrastructure
# PostgreSQL 16 for local development only. Never use these credentials in production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: medical-wellness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_wellness}
      POSTGRES_USER: ${POSTGRES_USER:-medwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medwell} -d ${POSTGRES_DB:-medical_wellness}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
